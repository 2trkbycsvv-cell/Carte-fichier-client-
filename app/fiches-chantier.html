<style>
/* Layout : une colonne étroite type appli mobile ; écran 1 = choix de la fiche, puis une section par écran, barre d'actions collée en bas */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#23271f; --muted:#646b5d; --line:#d9ded3;
  --green:#5f9a2e; --green-soft:#e6f1da; --ink:#1d4fa3; --danger:#b3261e;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151812; --surface:#1f231b; --fg:#e8ece2; --muted:#a2aa98; --line:#353b2e;
  --green:#8cc85a; --green-soft:#2a3a1d; --ink:#8fb4ff; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151812; --surface:#1f231b; --fg:#e8ece2; --muted:#a2aa98; --line:#353b2e;
  --green:#8cc85a; --green-soft:#2a3a1d; --ink:#8fb4ff; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding-block:18px 10px}
header img{height:38px;border-radius:6px;background:#fff;padding:3px 6px}
header h1{font-family:var(--display);font-size:1.25rem;margin:0;line-height:1.1}
header p{margin:0;color:var(--muted);font-size:.85rem}
.progress{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .25s}
.steplabel{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
h2{font-family:var(--display);font-size:1.5rem;margin:14px 0 4px;text-wrap:balance}
.hint{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.qt{display:block;font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);font-weight:600}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,.fcard:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,textarea{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--fg);min-height:44px}
textarea{min-height:70px;resize:vertical}
.other{margin-top:8px}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--muted);white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2>div{min-width:0}
.grid{display:grid;gap:6px}.grid input{min-height:40px;padding:8px 10px;font-size:.92rem}
.gridhead{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fiches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{font:inherit;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--fg);min-height:64px;display:flex;flex-direction:column;gap:2px}
.fcard b{font-family:var(--display);font-size:1.05rem;line-height:1.15}
.fcard small{color:var(--muted);font-size:.78rem}
.fcard[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 8px}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:3}
.actions .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;min-height:48px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--fg)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;flex:1}
.btn[disabled]{opacity:.4;cursor:default}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.recap h3{margin:0;padding:10px 14px;font-family:var(--display);font-size:1rem;background:var(--green-soft)}
.recap dl{margin:0;padding:6px 14px 10px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4px 12px;font-size:.92rem}
.recap dt{color:var(--muted)} .recap dd{margin:0;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.recap dd.empty{color:var(--danger);font-weight:500}
.recap+.recap{margin-top:12px}
.msg{margin-top:12px;font-size:.92rem;padding:10px 12px;border-radius:10px;background:var(--green-soft)}
.msg.err{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.link{background:none;border:none;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.toprow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem;margin-bottom:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.photos figure{margin:0;position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:absolute;top:4px;right:4px;border:none;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
.filebtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:1.5px dashed var(--green);border-radius:12px;color:var(--fg);font-weight:600;cursor:pointer;background:var(--green-soft)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <img id="logo" alt="DCRF Rénovation d'habitat">
    <div><h1>Fiches chantier DCRF</h1><p>Questionnaire guidé, fiche + croquis + photos en PDF</p></div>
  </header>
  <div class="toprow">
    <button class="link" id="loadEx" type="button">Charger l'exemple (M. Lafaye, toiture)</button>
    <button class="link" id="reset" type="button">Nouvelle fiche</button>
  </div>
  <div class="progress"><div class="bar"><i id="barfill"></i></div><div class="steplabel"><span id="stepn"></span><span id="stept"></span></div></div>
  <main id="main"></main>
</div>
<div class="actions"><div class="in">
  <button class="btn" id="prev" type="button">Retour</button>
  <button class="btn primary" id="next" type="button">Suivant</button>
</div></div>

function field(q){

    for(let r=0;r<n;r++)q.cols.forEach((c,ci)=>h+=`<input aria-label="${esc(c)} ligne ${r+1}" data-grid="${q.id}" data-r="${r}" data-c="${ci}" value="${esc(rows[r]?.[ci]||"")}">`);

  q.o.forEach(o=>h+=`<button type="button" class="chip" data-chip="${q.id}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`);
  if(q.other)h+=`<button type="button" class="chip" data-chip="${q.id}" data-other="1" aria-pressed="${!!(isOther||D["_o_"+q.id])}">Autre</button>`;

function addPhotos(e){
  const files=[...e.target.files];
  Promise.all(files.map(f=>new Promise(res=>{
    const url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.8))};
    img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url;
  }))).then(r=>{PH.push(...r.filter(Boolean));render()});
}

const fd=s=>{if(!s)return"";const p=String(s).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const numv=s=>{const m=String(s||"").replace(/\s/g,"").replace(",",".").match(/[\d.]+/);return m?parseFloat(m[0]):NaN};
function show(q){
  if(q.if&&!q.if(D))return "-";
  const v=D[q.id];
  if(q.type==="grid")return (Array.isArray(v)?v:[]).filter(r=>r&&r.some(Boolean)).map(r=>q.cols.map((c,i)=>r[i]||"-").join(" / ")).join(" ; ");
  if(v===undefined||v==="")return "";
  if(q.type==="date")return fd(v);
  if(q.type==="num"&&q.u&&!String(v).includes(q.u))return v+" "+q.u;
  return String(v);
}

function makePDF(){

  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"}), f=fiche();

  doc.addPage(); f.croquis==="toit"?croquisToit(doc):f.croquis==="facade"?croquisFacade(doc):croquisBlanc(doc);
  PH.forEach((p,i)=>{doc.addPage();T(doc,105,14,`Photo ${i+1} / ${PH.length} - ${D.client||""}`,{s:10,c:1});
    const pr=doc.getImageProperties(p);const k=Math.min(180/pr.width,255/pr.height);doc.addImage(p,"JPEG",105-pr.width*k/2,20,pr.width*k,pr.height*k)});
  const name=(f.name.replace(/[^\wÀ-ÿ]+/g,"_")+"_"+(D.client||"client").replace(/^(M\.|Mme|Mr)\s*/i,"").replace(/[^\wÀ-ÿ-]+/g,"_")).replace(/_+/g,"_")+".pdf";
  const blob=doc.output("blob");
  out.innerHTML=`<p class="msg">PDF prêt…</p>`;
  (async()=>{
    let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}
    if(dl){
      try{await dl.save({filename:name,data:blob});out.innerHTML=`<p class="msg">${esc(name)} enregistré.</p>`}
      catch(e){out.innerHTML=e&&e.code==="declined"?`<p class="msg">Enregistrement annulé. Appuie sur « Générer le PDF » pour recommencer.</p>`:`<p class="msg err">Enregistrement impossible (${esc(e&&e.code||"erreur")}).</p>`}
      return;
    }
    // Appli DCRF : partage (iPhone : Enregistrer dans Fichiers, Mail, WhatsApp…) sinon téléchargement
    const file=new File([blob],name,{type:"application/pdf"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});out.innerHTML=`<p class="msg">${esc(name)} prêt.</p>`;return}
    }catch(e){if(e&&e.name==="AbortError"){out.innerHTML=`<p class="msg">Partage annulé. Appuie sur « Générer le PDF » pour recommencer.</p>`;return}}
    const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
    out.innerHTML=`<p class="msg">${esc(name)} téléchargé.</p>`;
  })();
}
